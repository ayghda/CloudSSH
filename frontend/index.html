<body class="min-h-screen font-body text-sm">
  <div id="app">
    <!-- Login Page (匿名连接) -->
    <div id="auth-section">
      <style>
        #auth-section {
          /* 白天模式颜色 */
          --login-bg: #f8fafc;
          --login-card: #ffffff;
          --login-text: #64748b;
          --login-border: #e2e8f0;
          --login-title: #3b82f6;
          --login-btn: #3b82f6;
          --login-btn-hover: #2563eb;
          --login-icon: #3b82f6;
          
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          width: 100%;
          background-color: var(--login-bg);
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          transition: background-color 0.3s ease;
          padding: 24px;
          box-sizing: border-box;
        }

        /* 完美还原截图的暗黑模式逻辑 */
        html.dark #auth-section {
          --login-bg: #0b1121; /* 原版最底层的深色背景 */
          --login-card: #161b2a; /* 稍微提亮的卡片背景 */
          --login-text: #94a3b8;
          --login-border: #1f2937;
        }

        /* 修复拉伸问题的关键：必须使用 max-width */
        .login-container { 
          width: 100%; 
          max-width: 380px; /* 强制限制最大宽度，保证小巧精致 */
          position: relative; 
          z-index: 10; 
        }
        
        .login-header { 
          text-align: center; 
          margin-bottom: 28px; 
          position: relative; 
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        
        .login-title { 
          color: var(--login-title); 
          font-size: 28px; 
          font-weight: 700; 
          margin: 0 0 6px 0; 
          letter-spacing: -0.5px; 
        }
        
        .login-subtitle { 
          color: var(--login-text); 
          font-size: 14px; 
          margin: 0; 
        }
        
        /* 主题切换按钮 */
        .theme-btn {
          position: absolute; 
          right: 0; 
          top: 0;
          background: transparent; 
          border: 1px solid var(--login-border);
          color: var(--login-text); 
          border-radius: 50%; 
          width: 34px; 
          height: 34px;
          display: flex; 
          align-items: center; 
          justify-content: center;
          cursor: pointer; 
          transition: all 0.2s ease; 
          padding: 0;
        }
        .theme-btn:hover { background: var(--login-border); color: var(--login-title); }
        .theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* 动态控制太阳和月亮的显示 */
        html.dark .icon-moon { display: none; }
        html:not(.dark) .icon-sun { display: none; }

        .login-card {
          background: var(--login-card); 
          border: 1px solid var(--login-border);
          border-radius: 12px; 
          padding: 24px;
          box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-top-title { color: var(--login-title); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
        .card-top-icon { width: 20px; height: 20px; color: var(--login-icon); }
        
        .card-line { height: 1px; background: var(--login-border); border: none; margin: 0 0 20px 0; }
        .card-desc { color: var(--login-text); font-size: 13.5px; line-height: 1.6; text-align: center; margin: 0 0 24px 0; }
        
        /* GitHub 登录按钮 */
        .github-btn {
          display: flex; align-items: center; justify-content: center; gap: 8px;
          width: 100%; background: var(--login-btn); color: #fff;
          border: none; border-radius: 8px; padding: 10px 16px;
          font-size: 14px; font-weight: 500; cursor: pointer;
          transition: background 0.2s; text-decoration: none; box-sizing: border-box;
        }
        .github-btn:hover { background: var(--login-btn-hover); }
        .github-btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

        .login-footer { text-align: center; color: var(--login-text); font-size: 12px; margin-top: 24px; opacity: 0.8; }
      </style>

      <div class="login-container">

            </svg>
          </button>
        </div>

        <!-- 登录核心卡片 -->
        <div class="login-card">
          <div class="card-top">
            <span class="card-top-title">登入</span>

            </svg>
            使用 GitHub 登录

        </div>

        <div class="login-footer">
          系统就绪，等待连接。
        </div>

        <!-- 必须保留的底层表单容器，防止原项目 TS 运行时报错白屏 -->
        <div id="connection-form-container" style="display: none;"></div>
      </div>
      
      <!-- 主题切换逻辑 -->
      <script>
        document.getElementById('custom-theme-toggle').addEventListener('click', () => {
          const htmlEl = document.documentElement;
          // 切换原有的 dark class 联动全局
          htmlEl.classList.toggle('dark');
          // 可选：将用户偏好存入本地存储，原项目可能需要
          localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
        });
      </script>
    </div>
